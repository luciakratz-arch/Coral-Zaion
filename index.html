<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <title>Coral Zaion</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#C9A227"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Zaion"/>
  <link rel="apple-touch-icon" href="LOGOCORAL.jpeg"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#0D0D0D;color:#E8D5A3;}
    #root{min-height:100vh;}

    /* PWA install modal */
    #modal-pwa{
      display:none;position:fixed;inset:0;z-index:9999;
      background:rgba(0,0,0,0.7);
      justify-content:center;align-items:flex-end;
      padding-bottom:20px;
    }
    #modal-pwa .card{
      background:#1A1400;border-radius:18px;padding:24px 20px 20px;
      width:100%;max-width:400px;text-align:center;
      border:1px solid #C9A227;
      box-shadow:0 8px 32px rgba(201,162,39,0.25);
    }
    #modal-pwa img{width:72px;height:72px;border-radius:14px;object-fit:cover;margin-bottom:12px;}
    #modal-pwa h2{font-size:18px;font-weight:700;color:#C9A227;margin-bottom:6px;}
    #modal-pwa p{font-size:13px;color:#C9B880;margin-bottom:16px;line-height:1.5;}
    #modal-pwa .btn-inst{
      display:block;width:100%;padding:13px;
      background:#C9A227;color:#0D0D0D;
      border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
      margin-bottom:10px;
    }
    #modal-pwa .btn-fechar{
      background:none;border:none;color:#9A8A60;font-size:13px;cursor:pointer;padding:4px;
    }
    #modal-pwa .ios-steps{display:none;margin-top:10px;text-align:left;}
    #modal-pwa .ios-steps li{font-size:12px;color:#C9B880;margin-bottom:6px;padding-left:6px;}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- PWA Install Modal -->
  <div id="modal-pwa">
    <div class="card">
      <img src="LOGOCORAL.jpeg" alt="Coral Zaion"/>
      <h2>Instalar Coral Zaion</h2>
      <p>Adicione o app à sua tela inicial para acessar rapidamente, mesmo sem internet.</p>
      <div id="modal-ios-steps" class="ios-steps" style="display:none">
        <p style="font-size:12px;color:#C9B880;margin-bottom:8px;">No Safari, toque em <strong>⎋ Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.</p>
      </div>
      <button class="btn-inst" id="btn-instalar" onclick="instalarPWA()">⬇ Instalar App</button>
      <button class="btn-fechar" onclick="fecharModalPWA()">Agora não</button>
    </div>
  </div>

  <script>
    var deferredPrompt = null;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    var isInStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      window.__pwaPrompt = e;
    });

    window.instalarPWA = function(){
      if(deferredPrompt){
        var p = deferredPrompt;
        deferredPrompt = null;
        p.prompt();
        p.userChoice.then(function(){ fecharModalPWA(); });
      }
    };

    window.fecharModalPWA = function(){
      var el = document.getElementById('modal-pwa');
      if(el) el.style.display='none';
      try{ localStorage.setItem('zaion_pwa_dismissed','1'); }catch(e){}
    };

    if(!isInStandaloneMode){
      var dismissed = false;
      try{ dismissed = localStorage.getItem('zaion_pwa_dismissed') === '1'; }catch(e){}
      if(!dismissed){
        setTimeout(function(){
          var el = document.getElementById('modal-pwa');
          if(el){
            el.style.display='flex';
            if(isIOS){
              document.getElementById('btn-instalar').style.display='none';
              document.getElementById('modal-ios-steps').style.display='block';
            }
          }
        }, 1500);
      }
    }
  </script>

  <!-- React + Firebase + Lucide -->
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>

  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('./sw.js').catch(function(e){ console.log('SW error',e); });
      });
    }
  </script>
</body>
</html>
