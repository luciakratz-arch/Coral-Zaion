  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#0D0D0D;color:#FFFFFF;}
    #root{min-height:100vh;}
    html,body{max-width:100%;overflow-x:hidden;}
    @media (max-width:768px){
      #root{max-width:100vw;overflow-x:hidden;}
      .main-content{width:100%;max-width:100vw;overflow-x:hidden;}
      .main-content img,.main-content table{max-width:100%;}
      .main-content select,.main-content input{max-width:100%;min-width:0;}
    }

    /* PWA install modal */
    #modal-pwa{
      display:none;position:fixed;inset:0;z-index:9999;
      background:rgba(0,0,0,0.7);
      justify-content:center;align-items:flex-end;
      padding-bottom:20px;
    }
    #modal-pwa .card{
      background:#1A1400;border-radius:18px;padding:24px 20px 20px;
      width:100%;max-width:400px;text-align:center;
      border:1px solid #C9A227;
      box-shadow:0 8px 32px rgba(201,162,39,0.25);
    }
    #modal-pwa img{width:72px;height:72px;border-radius:14px;object-fit:cover;margin-bottom:12px;}
    #modal-pwa h2{font-size:18px;font-weight:700;color:#C9A227;margin-bottom:6px;}
    #modal-pwa p{font-size:13px;color:#C9B880;margin-bottom:16px;line-height:1.5;}
    #modal-pwa .btn-inst{
      display:block;width:100%;padding:13px;
      background:#C9A227;color:#0D0D0D;
      border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
      margin-bottom:10px;
    }
    #modal-pwa .btn-fechar{
      background:none;border:none;color:#9A8A60;font-size:13px;cursor:pointer;padding:4px;
    }
    #modal-pwa .ios-steps{display:none;margin-top:10px;text-align:left;}
    #modal-pwa .ios-steps li{font-size:12px;color:#C9B880;margin-bottom:6px;padding-left:6px;}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- PWA Install Modal -->
  <div id="modal-pwa">
    <div class="card">
      <img src="logo.jpg" alt="Coral Zaion"/>
      <h2>Instalar Coral Zaion</h2>
      <p>Adicione o app à sua tela inicial para acessar rapidamente, mesmo sem internet.</p>
      <div id="modal-ios-steps" class="ios-steps" style="display:none">
        <p style="font-size:12px;color:#C9B880;margin-bottom:8px;">No Safari, toque em <strong>⎋ Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.</p>
      </div>
      <button class="btn-inst" id="btn-instalar" onclick="instalarPWA()">⬇ Instalar App</button>
      <button class="btn-fechar" onclick="fecharModalPWA()">Agora não</button>
    </div>
  </div>

  <script>
    var deferredPrompt = null;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    var isInStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      window.__pwaPrompt = e;
    });

    window.instalarPWA = function(){
      if(deferredPrompt){
        var p = deferredPrompt;
        deferredPrompt = null;
        p.prompt();
        p.userChoice.then(function(){ fecharModalPWA(); });
      }
    };

    window.fecharModalPWA = function(){
      var el = document.getElementById('modal-pwa');
      if(el) el.style.display='none';
      try{ localStorage.setItem('zaion_pwa_dismissed','1'); }catch(e){}
    };

    if(!isInStandaloneMode){
      var dismissed = false;
      try{ dismissed = localStorage.getItem('zaion_pwa_dismissed') === '1'; }catch(e){}
      if(!dismissed){
        setTimeout(function(){
          var el = document.getElementById('modal-pwa');
          if(el){
            el.style.display='flex';
            if(isIOS){
              document.getElementById('btn-instalar').style.display='none';
              document.getElementById('modal-ios-steps').style.display='block';
            }
          }
        }, 1500);
      }
    }
  </script>


  <!-- Controle de tamanho das letras -->
  <style>
    #fs-ctl{position:fixed;right:12px;bottom:12px;z-index:9998;display:flex;gap:6px;align-items:center;
      background:#C9A227;border-radius:28px;padding:6px 8px;box-shadow:0 2px 10px rgba(0,0,0,.4);}
    #fs-ctl button{width:44px;height:44px;border-radius:50%;border:none;background:#1A1400;color:#FFFFFF;
      font-weight:700;cursor:pointer;font-family:inherit;line-height:1;}
    #fs-ctl .menos{font-size:15px;} #fs-ctl .mais{font-size:22px;} #fs-ctl .ouvir{font-size:22px;background:#FFFFFF;color:#1A1400;} #fs-ctl .ouvir.falando{background:#C0392B;color:#fff;}
    #fs-ctl button:disabled{opacity:.35;cursor:default;}
    @media (min-width:769px){#fs-ctl{bottom:56px;}}
    @media (max-width:768px){#fs-ctl{bottom:76px;}}
  </style>
  <script>
  (function(){
    var N=[1,1.15,1.3,1.5];
    function get(){var v=1;try{v=parseFloat(localStorage.getItem('zaion_fs'))||1;}catch(e){}var i=N.indexOf(v);return i<0?0:i;}
    function set(i){
      try{localStorage.setItem('zaion_fs',String(N[i]));}catch(e){}
      if(typeof window.__setFS==='function'){
        window.__setFS(N[i]);
        var mm=document.querySelector('#fs-ctl .menos'),pp=document.querySelector('#fs-ctl .mais');
        if(mm) mm.disabled=i===0; if(pp) pp.disabled=i===N.length-1;
      } else { location.reload(); }
    }
    var box=document.createElement('div');box.id='fs-ctl';box.setAttribute('aria-label','Tamanho das letras');
    var m=document.createElement('button');m.className='menos';m.textContent='A−';m.title='Diminuir letras';
    var p=document.createElement('button');p.className='mais';p.textContent='A+';p.title='Aumentar letras';
    var i=get();m.disabled=i===0;p.disabled=i===N.length-1;
    m.onclick=function(){set(Math.max(0,get()-1));};
    p.onclick=function(){set(Math.min(N.length-1,get()+1));};
    var o=document.createElement('button');o.className='ouvir';o.id='fs-ouvir';o.textContent='🔊';o.title='Ouvir o que está na tela';o.setAttribute('aria-label','Ouvir o que está na tela');
    box.appendChild(m);box.appendChild(p);box.appendChild(o);
    window.addEventListener('load',function(){document.body.appendChild(box);});
  })();
  </script>


  <!-- Leitura em voz alta (acessibilidade) -->
  <script>
  (function(){
    if(!('speechSynthesis' in window)) return;
    var falando=false, fila=[], pos=0;
    function pegarTexto(){
      var sel=''; try{ sel=String(window.getSelection()).trim(); }catch(e){}
      if(sel) return sel;
      var alvo=null, fixos=document.querySelectorAll('#root [style*="position: fixed"], body > [style*="position: fixed"]');
      for(var k=0;k<fixos.length;k++){
        var el=fixos[k];
        if(el.id==='fs-ctl'||el.id==='modal-pwa'||el.closest('#fs-ctl')) continue;
        var r=el.getBoundingClientRect(), z=parseInt(getComputedStyle(el).zIndex,10)||0;
        if(z>=300 && r.width>200 && r.height>200 && (el.innerText||'').trim().length>20) alvo=el;
      }
      if(!alvo) alvo=document.querySelector('.main-content')||document.getElementById('root');
      return alvo?(alvo.innerText||''):'';
    }
    function dividir(t){
      t=t.replace(/\s*\n+\s*/g,'. ').replace(/\.\s*\./g,'.').replace(/\s+/g,' ').trim();
      var partes=t.match(/[^.!?;:]+[.!?;:]?/g)||[t], out=[], cur='';
      partes.forEach(function(s){
        if((cur+s).length>180){ if(cur) out.push(cur); cur=s; } else cur+=s;
      });
      if(cur) out.push(cur);
      return out;
    }
    function escolherVoz(){
      var v=speechSynthesis.getVoices()||[];
      return v.filter(function(x){return /^pt[-_]BR/i.test(x.lang);})[0]||v.filter(function(x){return /^pt/i.test(x.lang);})[0]||null;
    }
    function botao(){return document.getElementById('fs-ouvir');}
    function parar(){
      falando=false; fila=[]; speechSynthesis.cancel();
      var b=botao(); if(b){ b.classList.remove('falando'); b.textContent='🔊'; b.title='Ouvir o que está na tela'; }
    }
    function proximo(){
      if(!falando) return;
      if(pos>=fila.length){ parar(); return; }
      var u=new SpeechSynthesisUtterance(fila[pos++]);
      u.lang='pt-BR'; u.rate=0.9;
      var v=escolherVoz(); if(v) u.voice=v;
      u.onend=proximo; u.onerror=function(){ if(falando) proximo(); };
      speechSynthesis.speak(u);
    }
    function iniciar(){
      var t=pegarTexto();
      fila=dividir(t); pos=0;
      if(!fila.length) return;
      falando=true;
      var b=botao(); if(b){ b.classList.add('falando'); b.textContent='⏹'; b.title='Parar a leitura'; }
      speechSynthesis.cancel();
      proximo();
    }
    window.addEventListener('load',function(){
      document.addEventListener('click',function(e){
        var b=e.target.closest&&e.target.closest('#fs-ouvir');
        if(!b) return;
        if(falando) parar(); else iniciar();
      });
      window.addEventListener('beforeunload',function(){ speechSynthesis.cancel(); });
    });
  })();
  </script>

  <!-- Backup Firestore -->
  <script>
  (function(){
    if(window.innerWidth < 769) return;
    var COLS=["zaion_songs","zaion_members","zaion_events","zaion_config","zaion_avisos","zaion_frequencias","zaion_acessos","zaion_confirmacoes","zaion_estudos","zaion_noticias","zaion_relatorios_historico","zaion_sessoes_checkin"];
    function p2(x){return x<10?"0"+x:""+x;}
    window.fazerBackupZaion=function(){
      var btn=document.getElementById("btnBackupZaion");
      if(btn){btn.disabled=true;btn.textContent="⏳ Gerando...";}
      var bk={geradoEm:new Date().toLocaleString("pt-BR"),colecoes:{}};
      Promise.all(COLS.map(function(c){
        return db.collection(c).get().then(function(snap){
          var docs={};snap.forEach(function(d){docs[d.id]=d.data();});
          bk.colecoes[c]=docs;
        }).catch(function(){bk.colecoes[c]={_erro:"erro"};});
      })).then(function(){
        var blob=new Blob([JSON.stringify(bk,null,2)],{type:"application/json"});
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        var h=new Date();
        a.href=url;a.download="backup-zaion-"+p2(h.getDate())+p2(h.getMonth()+1)+h.getFullYear()+".json";
        a.click();URL.revokeObjectURL(url);
        if(btn){btn.disabled=false;btn.textContent="💾 Backup";}
      });
    };
    var b=document.createElement("button");
    b.id="btnBackupZaion";b.textContent="💾 Backup";
    b.style.cssText="position:fixed;bottom:12px;right:12px;z-index:9999;background:#C9A227;color:#1A1400;border:none;border-radius:18px;padding:7px 14px;font-size:12px;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.25);opacity:0.85;display:none;font-weight:700;";
    b.onclick=window.fazerBackupZaion;
    document.body.appendChild(b);
    // Exibe apenas para admin
    var _chkAdmin = setInterval(function(){
      try {
        var u = JSON.parse(localStorage.getItem('cf_user') || 'null');
        if(u && u.isAdmin === true){
          b.style.display='block';
          clearInterval(_chkAdmin);
        }
      } catch(e){}
    }, 1000);
  })();
  </script>
